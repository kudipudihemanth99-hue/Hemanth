<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmberGrid - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="stylesheet" href="styles.css?v=2">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }
    .theme-toggle-btn {
      position: absolute;
      top: 24px;
      right: 24px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: var(--text-main);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
      transition: all 0.3s;
    }
    body.dark-mode .theme-toggle-btn {
      color: white;
    }
    .theme-toggle-btn:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: scale(1.05);
    }
    .top-controls {
      position: absolute;
      top: 24px;
      right: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }
    .theme-toggle-btn {
      position: relative;
      top: 0;
      right: 0;
    }
    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 50, 150, 0.1), inset 0 2px 5px rgba(255, 255, 255, 1);
      text-align: center;
      animation: fadeIn 0.6s ease-out, floatBox 6s ease-in-out infinite;
    }
    body.dark-mode .login-container {
      background: rgba(11, 15, 25, 0.6);
      border-color: rgba(255,255,255,0.1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 2px 5px rgba(255, 255, 255, 0.05);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes floatBox {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }
    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .login-header {
      margin-bottom: 32px;
    }
    .brand-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, var(--primary), var(--accent-purple));
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: white;
      box-shadow: 0 0 24px var(--primary-glow);
    }
    .login-input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      color: #0f172a;
      font-size: 14px;
      margin-bottom: 16px;
      transition: all 0.3s;
      outline: none;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.05);
    }
    .login-input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(2, 132, 199, 0.2), inset 0 1px 3px rgba(0,0,0,0.02);
      background: rgba(255, 255, 255, 0.9);
    }
    .login-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--primary), #0ea5e9, var(--primary));
      background-size: 200% auto;
      border: none;
      border-radius: 12px;
      color: white;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 14px var(--primary-glow);
      animation: gradientShift 3s linear infinite;
    }
    .login-btn:hover {
      background-position: right center;
      box-shadow: 0 6px 20px var(--primary-glow);
      transform: translateY(-2px);
    }
    .login-btn:active {
      transform: scale(0.95);
    }
    .sso-divider {
      margin: 24px 0;
      display: flex;
      align-items: center;
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
    }
    .sso-divider::before, .sso-divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }
    body.dark-mode .sso-divider::before, body.dark-mode .sso-divider::after {
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .sso-divider span {
      padding: 0 10px;
    }
    .sso-btn {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      color: #0f172a;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s;
    }
    .sso-btn:hover {
      background: rgba(255, 255, 255, 0.9);
      transform: translateY(-2px);
    }
    body.dark-mode .sso-btn {
      background: rgba(0, 0, 0, 0.4);
      color: white;
      border-color: rgba(255, 255, 255, 0.1);
    }
    body.dark-mode .sso-btn:hover {
      background: rgba(0, 0, 0, 0.6);
      border-color: var(--primary);
    }
  </style>
</head>
<body>
  <div class="top-controls">
    <select id="lang-select" class="lang-select">
      <option value="en">English (US)</option>
      <option value="es">Español</option>
      <option value="fr">Français</option>
      <option value="de">Deutsch</option>
      <option value="zh">中文</option>
      <option value="hi">हिन्दी</option>
    </select>
    <button id="theme-toggle" class="theme-toggle-btn" title="Toggle Theme"><i class="ph-duotone ph-moon"></i></button>
  </div>
  <div class="login-container">
    <div class="login-header">
      <div class="brand-icon"><i class="ph-duotone ph-cpu"></i></div>
      <h1 style="font-size: 24px; font-weight: 800; color: #0f172a;">EmberGrid Central</h1>
      <p style="color: var(--text-muted); font-size: 14px; margin-top: 8px;">Enter credentials to access infrastructure</p>
    </div>
    <form id="login-form">
      <input type="text" class="login-input" placeholder="Operator ID" required value="admin">
      <input type="password" class="login-input" placeholder="Access Code" required value="embergrid2026">
      <button type="submit" class="login-btn">Authenticate & Connect</button>
      
      <div class="sso-divider"><span>OR CONTINUE WITH</span></div>
      
      <button type="button" class="sso-btn">
        <i class="ph-fill ph-google-logo" style="color:#ea4335; font-size:18px;"></i>
        Google
      </button>
      <button type="button" class="sso-btn">
        <i class="ph-fill ph-github-logo" style="font-size:18px;"></i>
        GitHub
      </button>
      <button type="button" class="sso-btn">
        <i class="ph-fill ph-microsoft-logo" style="color:#00a4ef; font-size:18px;"></i>
        Microsoft
      </button>
    </form>
  </div>
  <script>
    // Theme toggle logic
    const themeToggle = document.getElementById('theme-toggle');
    const icon = themeToggle.querySelector('i');
    
    if (localStorage.getItem('aura_theme') === 'dark') {
      document.body.classList.add('dark-mode');
      icon.className = 'ph-duotone ph-sun';
    }

    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      localStorage.setItem('aura_theme', isDark ? 'dark' : 'light');
      icon.className = isDark ? 'ph-duotone ph-sun' : 'ph-duotone ph-moon';
    });

    // Language logic
    const langSelect = document.getElementById('lang-select');
    
    const translations = {
      en: { title: "EmberGrid Central", subtitle: "Enter credentials to access infrastructure", p1: "Operator ID", p2: "Access Code", btn: "Authenticate & Connect" },
      es: { title: "EmberGrid Central", subtitle: "Ingrese credenciales para acceder", p1: "ID de Operador", p2: "Código de Acceso", btn: "Autenticar y Conectar" },
      fr: { title: "EmberGrid Central", subtitle: "Entrez vos identifiants", p1: "ID Opérateur", p2: "Code d'accès", btn: "S'authentifier" },
      de: { title: "EmberGrid Central", subtitle: "Geben Sie Anmeldedaten ein", p1: "Betreiber-ID", p2: "Zugangscode", btn: "Authentifizieren" },
      zh: { title: "EmberGrid 中央", subtitle: "输入凭据以访问基础架构", p1: "操作员 ID", p2: "访问代码", btn: "身份验证并连接" },
      hi: { title: "एम्बरग्रिड सेंट्रल", subtitle: "लॉगिन करने के लिए क्रेडेंशियल दर्ज करें", p1: "ऑपरेटर आईडी", p2: "एक्सेस कोड", btn: "प्रमाणित करें और कनेक्ट करें" }
    };

    const applyTranslation = (lang) => {
      if(!translations[lang]) return;
      const t = translations[lang];
      document.querySelector('.login-header h1').textContent = t.title;
      document.querySelector('.login-header p').textContent = t.subtitle;
      document.querySelectorAll('.login-input')[0].placeholder = t.p1;
      document.querySelectorAll('.login-input')[1].placeholder = t.p2;
      document.querySelector('.login-btn').textContent = t.btn;
    };

    if (localStorage.getItem('aura_lang')) {
      const savedLang = localStorage.getItem('aura_lang');
      langSelect.value = savedLang;
      applyTranslation(savedLang);
    }
    langSelect.addEventListener('change', (e) => {
      const newLang = e.target.value;
      localStorage.setItem('aura_lang', newLang);
      applyTranslation(newLang);
    });

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      localStorage.setItem('aura_auth', 'true');
      window.location.href = 'index.html';
    });
  </script>
</body>
</html>
